resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8090;
    allow 192.168.59.28;
    allow 192.168.59.48;
    allow 192.168.59.49;
    deny all;
    location / {
        set $backend nomad_kiwix_server:8080;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

server {
    listen 8310;
    allow 192.168.59.28;
    allow 192.168.59.48;
    allow 192.168.59.49;
    deny all;
    location / {
        set $backend nomad_kolibri_2:8080;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

server {
    listen 8311;
    allow 192.168.59.28;
    allow 192.168.59.48;
    allow 192.168.59.49;
    deny all;
    location / {
        set $backend nomad_kolibri_2:8311;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
