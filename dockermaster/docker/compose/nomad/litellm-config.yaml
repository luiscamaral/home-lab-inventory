model_list:
  - model_name: nomic-embed-text:v1.5
    litellm_params:
      model: ollama/nomic-embed-text:v1.5
      api_base: http://ollama:11434

  - model_name: deepseek-v4-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: claude-sonnet-4
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  drop_params: true
  telemetry: false

general_settings:
  # nomad_litellm is isolated on the project-nomad_default bridge (no host ports,
  # no macvlan IP) and Project NOMAD hardcodes `apiKey: 'nomad'` in OllamaService.
  dangerously_permit_weak_or_unset_master_key: true
