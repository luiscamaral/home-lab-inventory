server {
  listen 80;
  server_name kolibri.d.lcamaral.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name kolibri.d.lcamaral.com;
  ssl_certificate /etc/nginx/cert/d.lcamaral.com.fullchain;
  ssl_certificate_key /etc/nginx/cert/d.lcamaral.com.key;
  ssl_trusted_certificate /etc/nginx/cert/d.lcamaral.com.crt;
  ssl_protocols TLSv1.2 TLSv1.3;
  auth_basic off;

  location / {
    proxy_pass http://192.168.59.60:8310;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }
}

# Kolibri serves interactive ZIP content on a distinct origin/port.
server {
  listen 8311 ssl;
  server_name kolibri.d.lcamaral.com;
  ssl_certificate /etc/nginx/cert/d.lcamaral.com.fullchain;
  ssl_certificate_key /etc/nginx/cert/d.lcamaral.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  auth_basic off;

  location / {
    proxy_pass http://192.168.59.60:8311;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
