# Portainer — control plane on dockermaster (docker-servers-net macvlan
# 192.168.59.2). Reachable from all 3 rproxy HA peers via each host's
# server-net-shim interface. Upstream is Portainer's HTTP port 9000
# (native TLS on 9443 is self-signed; we terminate TLS here with the
# wildcard *.d.lcamaral.com cert from pfSense ACME).
#
# Also fronts external access: Cloudflare tunnel `bologna` routes
# portainer.cf.lcamaral.com -> https://nginx-rproxy:443 (SNI
# portainer.cf), which this server_name catch matches via the tunnel's
# Host header rewrite; the internal name portainer.d is the primary.
server {
  listen 80;
  server_name portainer.d.lcamaral.com portainer.cf.lcamaral.com;

  otel_trace_context propagate;

  return 301 https://$host$request_uri;
}

# HTTPS Server Block
server {
  listen 443 ssl;
  http2 on;
  server_name portainer.d.lcamaral.com portainer.cf.lcamaral.com;

  otel_trace_context propagate;

  ssl_certificate     /etc/nginx/cert/d.lcamaral.com.fullchain;
  ssl_certificate_key /etc/nginx/cert/d.lcamaral.com.key;
  ssl_trusted_certificate /etc/nginx/cert/d.lcamaral.com.crt;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer-when-downgrade always;

  location / {
    # Portainer UI/API on HTTP port 9000 (macvlan .59.2)
    proxy_pass http://192.168.59.2:9000;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Portainer console/exec, log streaming, and edge tunnels use websockets
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_hide_header WWW-Authenticate;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 100m;

    otel_trace on;
    otel_trace_context inject;
  }
}
