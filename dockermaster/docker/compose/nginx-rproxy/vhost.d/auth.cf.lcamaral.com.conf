# Keycloak HA upstream — 2-node Infinispan cluster
# Sticky sessions based on AUTH_SESSION_ID cookie (Keycloak's own session
# cookie) so a logged-in user stays on the same node for their session.
# Infinispan replicates the session across both nodes anyway, but sticky
# minimizes cache misses during auth flow.
upstream keycloak_cluster {
  hash $cookie_AUTH_SESSION_ID consistent;
  server 192.168.59.13:8080 max_fails=2 fail_timeout=10s;  # keycloak on dm
  server 192.168.59.43:8080 max_fails=2 fail_timeout=10s;  # keycloak-2 on ds-1
  keepalive 16;
}

# Port 80: this block has always been nginx's implicit default for plain HTTP (this is the
# first vhost file loaded); `default_server` makes it explicit so that it no longer depends on
# the file order. Behaviour is unchanged: unknown hosts are redirected to https://$host.
server {
  listen 80 default_server;
  server_name auth.cf.lcamaral.com;
  return 301 https://$host$request_uri;
}

# Port 443 DEFAULT server: anything that does not match a server_name (an IP-only connection,
# an unknown SNI, an unknown Host) keeps getting the *.d certificate and the Keycloak proxy,
# exactly as before the cf certificate existed, when this vhost was the implicit default
# (first file loaded) and used the *.d cert. It is explicit now, so adding the cf cert to the
# named block below does not change what those clients see. Keep it identical to the named
# block except for `listen`, `server_name` and the certificate.
server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/cert/d.lcamaral.com.fullchain;
  ssl_certificate_key /etc/nginx/cert/d.lcamaral.com.key;
  ssl_trusted_certificate /etc/nginx/cert/d.lcamaral.com.crt;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer-when-downgrade always;

  # Keycloak admin surface is never served on a public name (Cloudflare tunnel hostnames, or
  # anything that falls through to the default server). The console, the Admin REST API and the
  # master realm are only on keycloak.d.lcamaral.com (LAN / Twingate); self-registration is closed
  # at the edge as well as in the realm. Source-IP allow-lists don't work here: tunnel traffic
  # reaches Nginx from the cloudflared containers' LAN addresses.
  location ~ ^/admin(/|$) {
    return 403;
  }

  location ~ ^/realms/master(/|$) {
    return 403;
  }

  location ~ ^/realms/[^/]+/(login-actions/registration|protocol/openid-connect/registrations)(/|$) {
    return 403;
  }

  location / {
    proxy_pass http://keycloak_cluster;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Fail fast + fail over to the other keycloak
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 100m;
  }
}

# Named server: auth.cf.lcamaral.com on the cf.lcamaral.com certificate (Let's Encrypt, with
# auth.cf.lcamaral.com among its SANs). Browsers still reach the name through Cloudflare; LAN
# clients that resolve it to the rproxies (zot reaching Keycloak) verify this certificate.
server {
  listen 443 ssl;
  http2 on;
  server_name auth.cf.lcamaral.com;

  ssl_certificate     /etc/nginx/cert/cf.lcamaral.com.fullchain;
  ssl_certificate_key /etc/nginx/cert/cf.lcamaral.com.key;
