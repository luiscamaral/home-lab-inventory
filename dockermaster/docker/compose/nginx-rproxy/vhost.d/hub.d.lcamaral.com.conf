# Docker Hub mirror endpoint (LAN-only, PULL-ONLY; no Cloudflare tunnel).
#
# dockerd's `registry-mirrors` expects a Docker Hub mirror at the registry ROOT
# (https://hub.d.lcamaral.com/v2/library/alpine/...), while zot serves its Docker
# Hub pull-through cache under /v2/docker.io/... (see docs/zot-registry.md).
# This vhost rewrites /v2/<repo>/... -> /v2/docker.io/<repo>/... and proxies to zot.
#
# Safety:
#   * GET/HEAD only. Anything else (push, delete, mount) gets 405, so nothing can
#     write into docker.io/* through this name.
#   * Authorization is stripped: this endpoint is always anonymous, so it can never
#     use the zot admin credentials, and it only ever sees the docker.io/ namespace.
#   * _catalog is hidden (404): zot would answer with an unrelated listing.
#   * The rewrite skips paths already under /v2/docker.io/, so the `Link` header that
#     zot returns for tags/list pagination (which carries /v2/docker.io/...) works.
#     "docker.io" cannot be a Docker Hub namespace, so there is no ambiguity.

server {
  listen 80;
  server_name hub.d.lcamaral.com;

  otel_trace_context propagate;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name hub.d.lcamaral.com;

  otel_trace_context propagate;

  ssl_certificate     /etc/nginx/cert/d.lcamaral.com.fullchain;
  ssl_certificate_key /etc/nginx/cert/d.lcamaral.com.key;
  ssl_trusted_certificate /etc/nginx/cert/d.lcamaral.com.crt;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer-when-downgrade always;

  auth_basic off;

  # Shared proxy settings (repeated per location: nginx does not inherit
  # proxy_set_header into a location that defines its own).
  # Large layers; the first pull of an image triggers zot's on-demand sync from
  # Docker Hub, which can take a while before the first byte.
  client_max_body_size 0;
  proxy_http_version 1.1;
  proxy_read_timeout 900s;
  proxy_send_timeout 900s;
  proxy_request_buffering off;
  proxy_buffering off;

  # API version check (dockerd calls GET /v2/ first).
  location = /v2/ {
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    set $upstream_target 192.168.59.5;
    proxy_pass http://$upstream_target:5000/v2/;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    otel_trace on;
    otel_trace_context inject;
  }

  location = /v2/_catalog {
    return 404;
  }

  # Everything else under /v2/: manifests, blobs, tags/list, referrers.
  location /v2/ {
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    # `set` must come BEFORE `rewrite ... break`: break ends the rewrite-phase
    # directives, so a later `set` would be skipped and the upstream host empty.
    set $upstream_target 192.168.59.5;
    rewrite ^/v2/(?!docker\.io/)(.+)$ /v2/docker.io/$1 break;

    proxy_pass http://$upstream_target:5000;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    otel_trace on;
    otel_trace_context inject;
  }

  # Anything outside /v2/ (UI, /v2 without slash, zot's own API) is not served here.
  location / {
    return 404;
  }
}
