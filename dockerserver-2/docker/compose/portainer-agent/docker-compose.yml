# Portainer agent on dockerserver-2 (ds-2, VM 124), endpoint ID 13.
#
# Declarative source for the agent container. It was previously started with
# `docker run` (no compose project). Applied with `docker compose` on ds-2.
# Version must match the Portainer server (2.45.3); the server reaches the agent
# at tcp://192.168.59.42:9001.
#
# Rollback: image portainer/agent:2.39.1 (kept locally) with the same settings.

name: portainer-agent

networks:
  servers-net:
    name: docker-servers-net
    external: true

services:
  portainer-agent:
    image: portainer/agent:2.45.3
    container_name: portainer-agent
    restart: unless-stopped
    networks:
      servers-net:
        ipv4_address: 192.168.59.42
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.docker.stack: "portainer-agent"
      com.docker.service: "portainer-agent"
