self-hosted-runner:
  # Self-hosted runner labels declared so actionlint doesn't flag them
  # as unknown. The runner lives on dockerserver-1 (ds-1); the GitHub
  # runner service is the Terraform-managed Portainer stack
  # `terraform/portainer/stacks/github-runner.yml`. Keep this list in step
  # with `LABELS` there. See "Runner Labels" in docs/cicd-pipeline.md.
  labels:
    - docker          # whole fleet: any Docker runner
    - dockerserver-1  # specific host: ds-1
    # No runner carries this label. The deployment and rollback workflows
    # use it on purpose so they cannot start (see docs/cicd-pipeline.md).
    - dockermaster
