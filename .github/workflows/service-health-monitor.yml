name: Service Health Monitor

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:

env:
  THANOS_QUERY_URL: http://192.168.59.26:10902

permissions:
  contents: read
  issues: write

jobs:
  # Job 1: read the health signals from Thanos (all hosts, no credentials).
  health-assessment:
    name: Health Assessment
    runs-on: [self-hosted, docker]  # any LAN runner can reach Thanos
    outputs:
      report-b64: ${{ steps.check.outputs.report-b64 }}
      alert-required: ${{ steps.check.outputs.alert-required }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Query Thanos for firing alerts and down targets
        id: check
        run: |
          set -euo pipefail
          Q="$THANOS_QUERY_URL/api/v1/query"

          FIRING=$(curl -sS -m 15 --get "$Q" \
            --data-urlencode 'query=ALERTS{alertstate="firing"}' \
            | jq -c '[.data.result[]? | {
                alertname: .metric.alertname,
                severity:   (.metric.severity // "unknown"),
                instance:   (.metric.instance // ""),
                job:        (.metric.job // ""),
                category:   (.metric.category // "")
              }] | group_by(.alertname + "|" + .instance) | map(.[0]) // []')

          DOWN=$(curl -sS -m 15 --get "$Q" \
            --data-urlencode 'query=up == 0' \
            | jq -c '[.data.result[]? | {
                job:      (.metric.job // ""),
                instance: (.metric.instance // "")
              }] | unique // []')

          REPORT=$(jq -nc --argjson firing "$FIRING" --argjson down "$DOWN" \
            '{checked_at: (now | todateiso8601), firing_alerts: $firing, down_targets: $down}')

          ALERT_REQUIRED=$(jq -nr --argjson f "$FIRING" --argjson d "$DOWN" \
            'if (($f | length) + ($d | length)) > 0 then "true" else "false" end')

          # base64 keeps the JSON on one line and safe to pass between jobs.
          echo "report-b64=$(printf '%s' "$REPORT" | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "alert-required=$ALERT_REQUIRED" >> "$GITHUB_OUTPUT"

          echo "firing=$(printf '%s' "$FIRING" | jq length)"
          echo "down=$(printf '%s' "$DOWN" | jq length)"
          echo "alert-required=$ALERT_REQUIRED"

  # Job 2: open or update the single health-alert issue while things are red.
  alert-management:
    name: Alert Management
    needs: health-assessment
    if: needs.health-assessment.outputs.alert-required == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open or update health alert issue
        run: |
          set -euo pipefail
          REPORT=$(printf '%s' "${{ needs.health-assessment.outputs.report-b64 }}" | base64 -d)
          TITLE="🚨 Service Health Alert"
          BODY=$(mktemp)

          {
            echo "# Service Health Alert"
            echo ""
            echo "**Time:** $(printf '%s' "$REPORT" | jq -r .checked_at)"
            echo "**Firing alerts:** $(printf '%s' "$REPORT" | jq '.firing_alerts | length')"
            echo "**Down scrape targets:** $(printf '%s' "$REPORT" | jq '.down_targets | length')"
            echo ""
            echo "## Firing alerts"
            echo ""
            if [ "$(printf '%s' "$REPORT" | jq '.firing_alerts | length')" -gt 0 ]; then
              echo "| Alert | Severity | Instance | Job |"
              echo "|---|---|---|---|"
              printf '%s' "$REPORT" | jq -r '.firing_alerts[] | "| \(.alertname) | \(.severity) | \(.instance) | \(.job) |"'
            else
              echo "_None._"
            fi
            echo ""
            echo "## Down scrape targets"
            echo ""
            if [ "$(printf '%s' "$REPORT" | jq '.down_targets | length')" -gt 0 ]; then
              echo "| Job | Instance |"
              echo "|---|---|"
              printf '%s' "$REPORT" | jq -r '.down_targets[] | "| \(.job) | \(.instance) |"'
            else
              echo "_None._"
            fi
            echo ""
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$BODY"

          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label health-alert --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$BODY"
            echo "Updated issue #$EXISTING"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body-file "$BODY" --label health-alert --label automated
            echo "Created issue"
          fi

  # Job 3: close the issue once everything is healthy again.
  close-resolved-alerts:
    name: Close Resolved Alerts
    needs: health-assessment
    if: needs.health-assessment.outputs.alert-required == 'false'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Close resolved health alert issues
        run: |
          set -euo pipefail
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label health-alert --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "✅ **Health alert resolved.** All firing alerts and down scrape targets are clear. Closed automatically by the Service Health Monitor."
            echo "Closed issue #$n"
          done

  # Job 4: write a run summary.
  status-reporting:
    name: Status Reporting
    needs: health-assessment
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate health status report
        run: |
          set -euo pipefail
          REPORT=$(printf '%s' "${{ needs.health-assessment.outputs.report-b64 }}" | base64 -d)
          {
            echo "## 🏥 Service Health Status"
            echo ""
            echo "**Checked at:** $(printf '%s' "$REPORT" | jq -r .checked_at)"
            echo "**Firing alerts:** $(printf '%s' "$REPORT" | jq '.firing_alerts | length')"
            echo "**Down scrape targets:** $(printf '%s' "$REPORT" | jq '.down_targets | length')"
            echo ""
            echo "### Firing alerts"
            echo ""
            if [ "$(printf '%s' "$REPORT" | jq '.firing_alerts | length')" -gt 0 ]; then
              printf '%s' "$REPORT" | jq -r '.firing_alerts[] | "- **\(.alertname)** (\(.severity)) — \(.instance)"'
            else
              echo "_None._"
            fi
            echo ""
            echo "### Down scrape targets"
            echo ""
            if [ "$(printf '%s' "$REPORT" | jq '.down_targets | length')" -gt 0 ]; then
              printf '%s' "$REPORT" | jq -r '.down_targets[] | "- \(.job) @ \(.instance)"'
            else
              echo "_None._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
