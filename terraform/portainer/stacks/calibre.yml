name: calibre

# Calibre desktop (Selkies) + calibre-web reader on dockerserver-1.
#
# Desktop access is HTTPS-ONLY. linuxserver/calibre moved its remote-desktop
# layer from KasmVNC to Selkies; Selkies needs a browser secure context, so
# plain http://192.168.59.7:8080 now loads the sidebar and then fails with
# "This application requires a secure connection (HTTPS)". Use:
#   https://calibre.d.lcamaral.com     (nginx-rproxy → https://192.168.59.7:8181)
#   https://192.168.59.7:8181          (direct, self-signed cert)
#
# Image is pinned (not :latest + Watchtower). The KasmVNC→Selkies swap
# arrived silently via Watchtower and broke the documented access URL;
# pinning makes base-image changes a reviewed diff. v9.11.0-ls413 is the
# exact digest that was running when pinned (sha256:150db5b3…), so the pin
# itself changes no bits. Bump deliberately and verify the UI, not just a
# status code.
#
# 10-keyboard.conf is delivered via Compose `configs:` instead of a host
# bind-mount. The previous bind source on the NFS share
# (/nfs/dockermaster/docker/calibre-server/10-keyboard.conf) was silently
# replaced by an empty directory on 2026-05-11, breaking the file→file mount
# and putting the container into Exited (127) for ~2 weeks. The original
# content lives in `_archive/calibre-server/10-keyboard.conf` (US intl
# layout); inlining it here removes the host filesystem coupling per the
# project's IaC-first principle.

networks:
  servers-net:
    name: docker-servers-net
    external: true

configs:
  keyboard_conf:
    content: |
      XKBLayout="us"
      XKBVARIANT="intl"

services:
  calibre:
    image: linuxserver/calibre:v9.11.0-ls413
    hostname: calibre
    container_name: calibre
    shm_size: '2gb'
    networks:
      servers-net:
        ipv4_address: 192.168.59.7
    ports:
      - 58090:9090
    volumes:
      - /nfs/calibre/Library:/Library
      - /nfs/calibre/config:/config
      - /nfs/calibre/upload:/upload
      - /nfs/calibre/plugins:/plugins
      - /dev/dri:/dev/dri
    configs:
      - source: keyboard_conf
        target: /etc/X11/xorg.conf.d/10-keyboard.conf
        mode: 0644
    security_opt:
      - seccomp:unconfined
    environment:
      PUID: 1027
      PGID: 65539
      CUSTOM_USER: 'admin'
      PASSWORD: ${CALIBRE_PASSWORD}
      TZ: 'America/Denver'
      DISABLE_IPV6: true
      LANG: en_US.UTF-8
    restart: always
    healthcheck:
      # Probe the HTTPS listener (8181) — the only path Selkies supports.
      # 401 = basic-auth prompt, i.e. the web front is serving.
      test: ["CMD-SHELL", "curl -sk --max-time 5 -o /dev/null -w '%{http_code}' https://localhost:8181/ | grep -qE '^(200|401)$'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      com.centurylinklabs.watchtower.enable: "false"  # pinned — see header
      com.docker.stack: "calibre"
      com.docker.service: "calibre"
      portainer.autodeploy: "false"

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    hostname: calibre-web
    networks:
      servers-net:
        ipv4_address: 192.168.59.6
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DOCKER_MODS=linuxserver/mods:universal-calibre
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
    volumes:
      # /config holds calibre-web's SQLite app.db and MUST stay on local disk.
      # It previously lived on /nfs/calibre/calibre-web/config, an NFS4 export
      # mounted `soft,local_lock=none`. SQLite cannot survive that: a transient
      # NFS stall returns an I/O error instead of retrying, and there is no file
      # locking. On 2026-08-24 ~22:56 MDT that produced a burst of
      # `sqlite3.OperationalError: disk I/O error` + `OSError: [Errno 5]` on
      # /login, immediately after the nightly Rundeck `calibre-replication` job
      # (22:10 MDT) rsync'd into this same directory while the DB was open.
      # That job also carries a stale desktop-side app.db (Apr 2025) which `rsync
      # -a` would copy over the live one — moving /config off the NFS path
      # removes it from the rsync target and closes that clobber hole too.
      # Library/books stays on NFS: large, read-mostly, no SQLite writers.
      - /opt/calibre-web/config:/config
      - /nfs/calibre/calibre-web/Library:/books
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs --max-time 5 http://localhost:8083/login -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.docker.stack: "calibre"
      com.docker.service: "calibre-web"
      portainer.autodeploy: "false"
