name: pihole-exporter-3

# pihole-exporter-3 — scrapes pihole-3 (Docker on Synology NAS at
# 192.168.4.236). Runs on the NAS in home-net macvlan to stay close to
# the pihole instance and survive a Proxmox outage independently.
#
# Image: amonacoos/pihole6_exporter (Pi-hole v6 native).
# Auth: Pi-hole "App Password" via Portainer env { PIHOLE_API_KEY },
# sourced from Vault `secret/homelab/pihole.pihole_3_app_password`.
# See pihole-exporter-1.yml for the full rationale.
#
# Macvlan-only containers cannot use Docker's embedded DNS (127.0.0.11) —
# explicit `dns:` mirrors the pihole-3 / prometheus-2 pattern, per
# project memory feedback_macvlan_dns.md.
#
# IP allocation: home-net's IPRange is 192.168.4.232/29 (.232-.239),
# fully consumed. The macvlan parent is 192.168.4.0/24 (HOME VLAN), so
# we allocate outside the IPRange but inside the parent — 192.168.4.240.

networks:
  home-net:
    name: home-net
    external: true

services:
  pihole-exporter:
    image: amonacoos/pihole6_exporter:latest
    hostname: pihole-exporter-3
    networks:
      home-net:
        ipv4_address: 192.168.4.240
    dns:
      - 192.168.4.1
      - 1.1.1.1
    environment:
      PIHOLE_HOST: 192.168.4.236
      PIHOLE_API_KEY: ${PIHOLE_API_KEY}
      PIHOLE_SCHEME: http
      PIHOLE_PORT: "80"
    restart: unless-stopped
    # Failsafe: bound the amonacoos/pihole6_exporter socket-FD leak — see
    # pihole-exporter-1.yml for the full incident rationale. This instance
    # scrapes a same-subnet target so it rarely fails a scrape and is not
    # expected to leak. NOTE: it runs on the Synology NAS, whose kernel has
    # no CPU CFS scheduler — `cpus:`/`pids_limit:` are rejected by the DSM
    # Docker daemon ("NanoCPUs can not be set"), so only mem_limit + the
    # nofile ceiling (the lever that actually prevents the wedge) apply here.
    mem_limit: 64m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      disable: true
      start_period: 30s
    labels:
      loki.logging: "true"
      com.centurylinklabs.watchtower.enable: "false"
      com.docker.stack: "pihole-exporter-3"
      com.docker.service: "pihole-exporter"
      portainer.autodeploy: "false"
